name: Weekly Growth Report

on:
  schedule:
    - cron: "0 7 * * 2"   # Tuesdays 07:00 UTC — Search Console data for the
                          # previous week (ending Sunday) is finalized by then
  workflow_dispatch: {}

permissions:
  contents: write         # lets the workflow commit the weekly .md into the repo

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install
        run: uv pip install --system .

      - name: Build and deliver report
        env:
          GA4_SA_JSON: ${{ secrets.GA4_SA_JSON }}
          REPORTER_SLACK_WEBHOOK: ${{ secrets.REPORTER_SLACK_WEBHOOK }}
          REPORTER_TELEGRAM_TOKEN: ${{ secrets.REPORTER_TELEGRAM_TOKEN }}
          REPORTER_TELEGRAM_CHAT_ID: ${{ secrets.REPORTER_TELEGRAM_CHAT_ID }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: growth-reporter run

      - name: Commit the report into the repo
        run: |
          git config user.name "growth-reporter"
          git config user.email "actions@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "Weekly growth report $(date -u +%F)"
          git push
